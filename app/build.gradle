plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.madrigalsolu.gestion502'
    compileSdk 36

    defaultConfig {
        applicationId "com.madrigalsolu.gestion502"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    //libreria para las animaciones
    implementation 'com.airbnb.android:lottie:6.5.0'
    //firebase analisis -----
    //Analitys de firebase
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    //Libreria de autentificacion de firebase
    implementation 'com.google.firebase:firebase-auth:22.1.2'
    //libreria de base de datos de firebase
    implementation 'com.google.firebase:firebase-database:20.2.2'
    implementation'com.google.firebase:firebase-storage:20.2.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.firebaseui:firebase-ui-database:8.0.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}